name = "reader-tts"
compatibility_date = "2026-08-01"
pages_build_output_dir = "dist"

# The build command CANNOT live here. Pages rejects the whole file with
# "Configuration file for Pages projects does not support build", which fails
# the deploy earlier and more confusingly than having no build command at all.
# `wrangler pages dev` does accept and run it locally, so it looks like it
# should work; it does not.
#
# It belongs in the dashboard: Settings → Builds & deployments → Build command
#   npm run build
#
# Without it Cloudflare skips the build and stops at `Output directory "dist"
# not found` — dist/ is generated and not committed, so there is nothing to
# upload. That failure is identical on every commit and mentions none of them.

# Public, non-secret configuration. The OAuth client id is served to the browser
# through /api/config, so it does not need to be baked into the bundle.
# Secrets (SESSION_SECRET, ENCRYPTION_KEY) are set with:
#   wrangler pages secret put SESSION_SECRET
#   wrangler pages secret put ENCRYPTION_KEY
[vars]
GOOGLE_CLIENT_ID = "605196260972-luhckq64ouv44t920lf5cdjs2i0mckfn.apps.googleusercontent.com"

# The id belongs to one Cloudflare account. On a fresh account, create the
# database and paste the new value:
#
#   npx wrangler d1 create reader-tts
#   npx wrangler d1 list              # confirms the id matches what is here
#
# Cloudflare validates bindings when it receives a deploy, so an id absent from
# the account rejects every deploy identically, whatever the code says. The
# commands that reach D1 check this value first (scripts/check-bindings.mjs) so
# that failure arrives as the step that was missed rather than as
# "Invalid uuid".
#
# Schema changes are numbered files under migrations/. Wrangler records which
# ones ran in a d1_migrations table, so applying is idempotent and
# `npm run pages:deploy` can do it on every deploy without a guard.
[[d1_databases]]
binding = "DB"
database_name = "reader-tts"
database_id = "055f160e-1126-431a-b41d-31c7cb823d4c"
migrations_dir = "migrations"

# Blob storage for EPUBs and covers. KV rather than R2 because R2 requires a
# payment method on the account even inside the free tier.
# Create with: wrangler kv namespace create FILES
[[kv_namespaces]]
binding = "FILES"
id = "bb00390202254bc4ae416998df60cdc0"
